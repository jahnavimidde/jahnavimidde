<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator App</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 60px; }
    input, select, button { padding: 8px; margin: 5px; }
    #result { margin-top: 20px; font-size: 20px; color: green; }
  </style>
</head>
<body>
  <h2>Simple Calculator</h2>

  <input type="number" id="num1" placeholder="Enter number 1">
  <input type="number" id="num2" placeholder="Enter number 2">

  <select id="operation">
    <option value="add">Add</option>
    <option value="subtract">Subtract</option>
    <option value="multiply">Multiply</option>
    <option value="divide">Divide</option>
  </select>

  <button onclick="calculate()">Calculate</button>

  <div id="result"></div>

  <script>
    async function calculate() {
      const num1 = document.getElementById('num1').value;
      const num2 = document.getElementById('num2').value;
      const operation = document.getElementById('operation').value;

      const response = await fetch(`http://localhost:3000/api/calc/${operation}?num1=${num1}&num2=${num2}`)

      const data = await response.json();

      document.getElementById('result').textContent = data.result !== undefined
        ? `Result: ${data.result}`
        : `Error: ${data.error}`;
    }
  </script>
</body>
</html>
